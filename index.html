<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="main-layout">
    
				
    <header class="pageheader sticky flex space-between align-center full">
        <div class="logo">Meme Generator<span>.</span></div>
        <nav class="headernav">
            <ul class="clean-list flex">
                <li><a href="/">Gallery</a></li>
                <li><a href="/">Memes</a></li>
                <li><a href="/">About</a></li>

            </ul>
        </nav>
    </header>
    <main class="main-content coollayout">
        <header class="ageheader flex space-between align-center">
            <form id="searchForm">
                <input type="search" id="mySearch" placeholder="Search...">
                <button type="submit">Go</button>
            </form>
            <div class="filter-by">
					<input
						class="vendor txt"
						oninput="onSetFilterBy()"
                        list = "car-suggestions"
						placeholder="Search a meme!"
						type="text"></div>
                <datalist id="car-suggestions">
        <option value="Helloy"></option>
    <option value="Green"></option>
    <option value="Blue"></option>
    <option value="Ferrari"></option>
</datalist>

            <nav class="headernav">
                <ul class="clean-list flex">
                    <li><a href="/">Gallery</a></li>
                    <li><a href="/">Memes</a></li>
                    <li><a href="/">About</a></li>

                </ul>
            </nav>
        </header>
        <div class="image-grid" id="imageGrid">
        </div>
    </main>
    <script src="js/services/editor.service.js"></script>
    <script src="js/meme.controller.js"></script>
</body>

</html>
