<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body onload="onInit()">
    <header class="pageheader sticky flex space-between align-center full">
        <div class="logo">Blogin<span>.</span></div>
        <nav class="headernav">
            <ul class="clean-list flex">
                <li><a href="/">Gallery</a></li>
                <li><a href="/">Memes</a></li>
                <li><a href="/">About</a></li>

            </ul>
        </nav>
    </header>
    <main class="main-content editor-layout">
        <section class="display-meme" id="display-meme">
            <canvas id="meme-canvas" width="500" height="500" style="width: 100%; height: auto;"></canvas>
        </section>


        <section class="editor-ui">
            <input type="text" class="control-input" placeholder="Text line" oninput="onSetLineText(this.value)">


            <div class="control-grid-small">

                <button class="control-btn" onclick="onSelectBottomText()">DOWN</button>
                <button class="control-btn" onclick="onSelectTopText()">⬆️</button></button><button class="btn-switch"
                    onclick="onSwitchText()">↕️</button><button>+</button><button>🗑️</button>
            </div>

            <div class="styling-grid">
                <button>A+</button><button>A-</button><button>L</button><button>C</button><button>R</button>
                <select class="font-select">
                    <option>IMPACT</option>
                </select>
                <button>S</button><label for="colorPicker" style="cursor: pointer;">
                    <button type="button" style="pointer-events: none;">🎨</button>
                </label>

                <input type="color" id="colorPicker" oninput="onSetColor(this.value)">
            </div>

            <div class="carousel-container">
                <button class="nav-btn">◀</button>

                <div class="previews">
                    <div class="box">X</div>
                    <div class="box">X</div>
                    <div class="box">X</div>
                    <div class="box">X</div>
                </div>

                <button class="nav-btn">▶</button>
            </div>

            <div class="footer-btns">
                <button class="share">Share</button>
                <button class="download">Download</button>
            </div>
        </section>
    </main>
    <script src="js/services/editor.service.js"></script>
    <script src="js/editor.controller.js"></script>


</body>

</html>
